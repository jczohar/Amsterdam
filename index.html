:root{--navy:#0b2a4a;--navy2:#123e6b;--blue:#1b5e9b;--red:#c8102e;--org:#ff7a00;--gold:#ffd54a;--bg:#eef3fa;--card:#fff;--tx:#1b2433;--mut:#5b6b82;--bd:#d6e0ee;--ok:#2e8b57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;font-family:"Segoe UI",Rubik,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);direction:rtl;font-size:16px;line-height:1.5}
body.nofs{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.ltr{direction:ltr;unicode-bidi:embed;text-align:left}
.small,small{font-size:.82rem;color:var(--mut)}
.big{font-size:1.05rem}
/* ---- כותרת ---- */
#top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#1d5a96 100%);color:#fff;position:relative}
#top:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px);pointer-events:none}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 12px 2px;position:relative;z-index:1}
.emb{width:38px;height:44px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:1.2rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{font-size:.8rem;color:#cfe0f5}
.gold{color:var(--gold);font-weight:800;text-shadow:0 0 6px rgba(255,213,74,.35)}

const phCache = (()=>{try{return JSON.parse(localStorage.getItem("ams_ph")||"{}");}catch(e){return {};}})();
let phSave=null;function phStore(){clearTimeout(phSave);phSave=setTimeout(()=>{try{localStorage.setItem("ams_ph",JSON.stringify(phCache));}catch(e){}},500);}
const phQ=[];let phBusy=0;
function loadPhoto(el){
 const w=el.dataset.w, custom=el.dataset.img;
 if(custom){setImg(el,custom);return;}
 if(!w)return;
 const c=phCache[w];
 if(c&&c!=="none"){setImg(el,c);return;}
 if(c==="none")return;
 phQ.push({el,w});pump();
}
function pump(){
 while(phBusy<3&&phQ.length){
  const {el,w}=phQ.shift();phBusy++;
  fetchJSON("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(w),8000).then(j=>{
   const u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||"";
   phCache[w]=u?u.replace(/\/\d+px-/,"/640px-"):"none";phStore();
   if(u)setImg(el,phCache[w]);
  }).catch(()=>{}).finally(()=>{phBusy--;pump();});
 }
}
function setImg(el,u){
 const im=new Image();im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";
 im.onload=()=>{el.style.backgroundImage="url('"+u+"')";el.classList.add("has");const em=$(".phem",el);if(em)em.style.display="none";};
 im.src=u;
}
const phObs = ("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){phObs.unobserve(e.target);loadPhoto(e.target);}});},{rootMargin:"300px"}):null;
function observePhotos(root=document){$$(".ph[data-w],.ph[data-img]",root).forEach(el=>{if(el._o)return;el._o=1;if(phObs)phObs.observe(el);else loadPhoto(el);});}

function matchQ(v,q){if(!q)return true;q=q.toLowerCase();return [v.he,v.en,v.nl,v.s,v.a,v.cu,v.ing,v.where].some(x=>x&&String(x).toLowerCase().indexOf(q)>=0);}
function filterBar(tab,tags,addCat){
 const f=tf(tab);
 let h=`<div class="fbar"><input class="fq" data-tab="${tab}" type="search" placeholder="🔎 חיפוש…" value="${esc(f.q)}">`;
 h+=`<div class="chips">${tags.map(t=>`<button class="chip ${f.tag===t[0]?"on":""}" data-act="tag" data-tab="${tab}" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>`;
 return h+`</div>`;
}
function listTab(tab,cat,tags,sorter,intro){
 const f=tf(tab);let all=allOf(cat);if(sorter)all=all.slice().sort(sorter);
 let vis=all.filter(v=>matchQ(v,f.q)&&(!f.tag||tagMatch(v,f.tag)));
 const hidN=all.filter(v=>S.hidden[v.id]).length;
 const shown=vis.filter(v=>f.hid||!S.hidden[v.id]);
 let h=`${intro?`<p class="intro">${intro}</p>`:""}`+filterBar(tab,tags);
 h+=`<div class="tools"><span class="cnt">${shown.length} ${CATS[cat].he}</span>
  ${hidN?`<button class="chip ${f.hid?"on":""}" data-act="toggleHid" data-tab="${tab}">👁️ מוסתרים (${hidN})</button>`:""}
  <button class="chip add" data-act="add" data-cat="${cat}">➕ הוספה</button></div>`;
 h+=`<div class="grid">${shown.map(card).join("")||`<p class="empty">לא נמצאו תוצאות. נסו לנקות את הסינון.</p>`}</div>`;
 return h;
}
function tagMatch(v,tag){
 if(tag==="day")return v.z==="D";if(tag==="city")return v.z!=="D";
 if(tag.startsWith("st"))return (v.st||0)===+tag.slice(2);
 if(tag.startsWith("lv"))return (v.lv||0)===+tag.slice(2);
 if(tag==="free")return /חינם/.test((v.pr||"")+(v.fr||""));
 return (v.in||[]).indexOf(tag)>=0;
}

function speak(t){
 try{const u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^nl/i.test(v.lang));if(v)u.voice=v;else toast("אין קול הולנדי במכשיר – ההשמעה עשויה להיות באנגלית");speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){toast("השמעה לא נתמכת במכשיר");}
}

function evRange(e,ref){ // מחזיר {s,e} הקרוב: מתקיים כעת / הבא
 const y=ref.getFullYear();let best=null;
 for(const yy of [y-1,y,y+1]){const s=new Date(yy,e.md[0]-1,e.md[1]);let en=new Date(yy,e.md[2]-1,e.md[3]);if(en<s)en=new Date(yy+1,e.md[2]-1,e.md[3]);
  if(en>=ref){if(!best||s<best.s)best={s,e:en};}}
 return best;
}
function viewEvents(){

 const from=f.from?parseDMY(f.from):null,to=f.to?parseDMY(f.to):null;

 if(from&&to)evs=evs.filter(e=>e._r.s<=to&&e._r.e>=from);else if(to)evs=evs.filter(e=>e._r.s<=to);
 if(f.tag)evs=evs.filter(e=>e.cat===f.tag);

 evs.sort((a,b)=>a._r.s-b._r.s);

 let h=`<p class="intro">אירועי תרבות, קונצרטים וספורט שחוזרים בעיר. התאריכים בערך – יש לוודא באתר המארגנים ולרכוש כרטיסים רק באתר הרשמי או במערכות כרטיסים מורשות (Ticketmaster, Ticketswap למכירה חוזרת בלבד).</p>`;
 h+=`<div class="fbar"><div class="chips">${[["","הכול"],["music","🎵 מוזיקה"],["sport","⚽ ספורט"],["culture","🎭 תרבות"],["festival","🎉 פסטיבלים"]].map(t=>`<button class="chip ${f.tag===t[0]?"on":""}" data-act="tag" data-tab="events" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div class="dr"><label>מתאריך ${dateField("evFrom",f.from||"")}</label><label>עד תאריך ${dateField("evTo",f.to||"")}</label><button class="chip" data-act="evClear">נקה תאריכים</button></div></div>`;
 h+=`<div class="tools"><span class="cnt">${evs.length} אירועים</span>${hidN?`<button class="chip ${f.hid?"on":""}" data-act="toggleHid" data-tab="events">👁️ מוסתרים (${hidN})</button>`:""}<button class="chip add" data-act="add" data-cat="event">➕ הוספה</button></div><div class="grid">`;
 evs.forEach(e=>{
  const r=e._r;const ong=r.s<=t0&&r.e>=t0;const dd=Math.round((r.s-t0)/864e5);
  const st=ong?`<span class="bd green">מתקיים עכשיו</span>`:(dd<=14?`<span class="bd gold">בעוד ${dd} ימים</span>`:`<span class="bd">בעוד ${dd} ימים</span>`);
  h+=`<article class="card c-event ${S.hidden[e.id]?"hid":""}" style="--cc:#c2185b" data-id="${esc(e.id)}"><div class="cb"><div class="ct"><h3>${e.em||"🎫"} ${esc(e.he)}</h3><div class="bds">${st}</div></div>
   <div class="row"><b>📆 מתי</b><span>${esc(e.when||"")}${e.date?" "+fmtD(fromYmd(e.date)):""} · ${fmtD(r.s)} ${r.e>r.s?"– "+fmtD(r.e):""}</span></div>
   <div class="row"><b>📍 איפה</b><span>${esc(e.where||"")}</span></div>
   <p class="sum">${esc(e.d||"")}</p>
   ${e.tk?`<div class="row"><b>🎫 כרטיסים</b><span>${esc(e.tk)}</span></div>`:""}${e.pr?`<div class="row"><b>💰 מחיר</b><span>${esc(e.pr)}</span></div>`:""}
   <div class="acts">${e.u?`<a class="ab" target="_blank" rel="noopener" href="${esc(e.u)}">🌐 אתר וכרטיסים</a>`:""}<a class="ab" target="_blank" rel="noopener" href="https://www.ticketmaster.nl/search?q=${encodeURIComponent(e.he.replace(/\(.*\)/,""))}">🎫 חיפוש כרטיסים</a><button class="ab" data-act="edit" data-id="${esc(e.id)}">✏️</button><button class="ab" data-act="hide" data-id="${esc(e.id)}">${S.hidden[e.id]?"👁️ החזר":"🙈 הסתר"}</button></div></div></article>`;});

function stepHe(s){
 const m=s.maneuver||{},t=m.type,mod=m.modifier||"";const nm=s.name?` ב-${s.name}`:"";
 const dir={left:"שמאלה",right:"ימינה","slight left":"קלות שמאלה","slight right":"קלות ימינה","sharp left":"חד שמאלה","sharp right":"חד ימינה",straight:"ישר",uturn:"סיבוב פרסה"}[mod]||"";
 let a;
 if(t==="depart")a="צאו"+(nm?nm:"");else if(t==="arrive")a="הגעתם ליעד";else if(t==="turn"||t==="end of road")a="פנו "+dir+nm;
 else if(t==="roundabout"||t==="rotary")a="בכיכר – צאו ביציאה "+(m.exit||"")+nm;else if(t==="fork")a="בפיצול החזיקו "+dir+nm;else if(t==="merge")a="התמזגו"+nm;
 else a="המשיכו"+(dir&&mod!=="straight"?" "+dir:" ישר")+nm;

let GRAPH=null;
function buildGraph(){
 const nodes={},adj={};const add=(a,b,w)=>{(adj[a]=adj[a]||[]).push([b,w]);};
 LINES.forEach(l=>{l.st.forEach((s,i)=>{const k=s+"|"+l.id;nodes[k]=1;if(i>0){const p=l.st[i-1]+"|"+l.id;const w=2+hav(STATIONS[s].la,STATIONS[s].lo,STATIONS[l.st[i-1]].la,STATIONS[l.st[i-1]].lo)*1.5;add(p,k,w);add(k,p,w);}});});
 const by={};Object.keys(nodes).forEach(k=>{const s=k.split("|")[0];(by[s]=by[s]||[]).push(k);});
 Object.values(by).forEach(arr=>arr.forEach(a=>arr.forEach(b=>{if(a!==b)add(a,b,5);})));
 GRAPH={nodes,adj,by};
}
function metroPath(sa,sb){
 if(!GRAPH)buildGraph();const {adj,by}=GRAPH;const dist={},prev={},done={};
 const q=[];(by[sa]||[]).forEach(k=>{dist[k]=0;q.push(k);});
 while(q.length){q.sort((x,y)=>dist[x]-dist[y]);const u=q.shift();if(done[u])continue;done[u]=1;
  (adj[u]||[]).forEach(([v,w])=>{const nd=dist[u]+w;if(dist[v]==null||nd<dist[v]){dist[v]=nd;prev[v]=u;q.push(v);}});}
 let best=null;(by[sb]||[]).forEach(k=>{if(dist[k]!=null&&(!best||dist[k]<dist[best]))best=k;});
 if(!best)return null;const path=[];for(let k=best;k;k=prev[k])path.unshift(k);
 const segs=[];path.forEach(k=>{const [s,l]=k.split("|");const last=segs[segs.length-1];if(last&&last.line===l)last.stops.push(s);else segs.push({line:l,stops:[s]});});
 const out=segs.filter(sg=>sg.stops.length>1).map(sg=>{const L=LINES.find(x=>x.id===sg.line);const i0=L.st.indexOf(sg.stops[0]),i1=L.st.indexOf(sg.stops[sg.stops.length-1]);return {line:L,stops:sg.stops,term:i1>i0?L.st[L.st.length-1]:L.st[0]};});
 return {segs:out,time:dist[best]+4};
}
function nearestStation(p){let b=null,bd=1e9;Object.keys(STATIONS).forEach(k=>{const d=hav(p.la,p.lo,STATIONS[k].la,STATIONS[k].lo);if(d<bd){bd=d;b=k;}});return {k:b,d:bd};}

 const wm=d=>Math.round(d*1.3/4.8*60);
 if(direct<0.9||na.k===nb.k)return null;
 const mp=metroPath(na.k,nb.k);if(!mp)return null;

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function holidaysOf(y){
 const E=easter(y);const H=[[new Date(y,0,1),"ראש השנה האזרחית"],[addDays(E,-2),"יום שישי הטוב (רוב החנויות פתוחות, חלק מהמוסדות סגורים)"],[E,"פסחא (יום ראשון)"],[addDays(E,1),"שני של פסחא"]];
 let k=new Date(y,3,27);if(k.getDay()===0)k=new Date(y,3,26);H.push([k,"יום המלך (Koningsdag) – העיר עמוסה מאוד"]);
 H.push([addDays(E,39),"חג העלייה (Hemelvaart)"],[addDays(E,49),"שבועות הנוצרי (Pinksteren)"],[addDays(E,50),"שני של שבועות הנוצרי"],[new Date(y,11,25),"חג המולד"],[new Date(y,11,26),"יום שני של חג המולד"],[new Date(y,11,31),"ערב השנה החדשה – זיקוקים ברחוב וחלק מהמקומות נסגרים מוקדם"]);
 return H;
}
function holidayOn(d){const h=holidaysOf(d.getFullYear()).find(x=>+x[0]===+d);return h?h[1]:"";}
function holidaysBetween(a,b){let out=[];for(let y=a.getFullYear();y<=b.getFullYear();y++)holidaysOf(y).forEach(h=>{if(h[0]>=a&&h[0]<=b)out.push(h);});return out.sort((x,y)=>x[0]-y[0]);}

   for(const s of pool){
    if(used[s.id])continue;if(date&&openOn(s,date).length)continue;if(s.z==="M"&&mus>=mcap)continue;
    const km=hav(cur.la,cur.lo,s.la,s.lo)*1.3;const m=defMode(km,o.low);const leg=legMinutes(km,m);const dur=s.dur||60;
    if(day.stops.length&&time+leg+dur>budget)continue;
    let sc=base(s)-km*(o.low?9:5);
    if(w){if(bad)sc+=s.ind?7:-9;else sc+=s.ind?0:3;}
    if(sc>bs){bs=sc;best={s,km,leg,dur,m};}
   }
   if(!best)break;
   used[best.s.id]=1;if(best.s.z==="M")mus++;
   day.stops.push({id:best.s.id,mode:best.m});time+=best.leg+best.dur;cur=best.s;
  }
  days.push(day);
 }
 return {id:"r-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:o.name||"המסלול שלי",created:ymd(new Date()),start:o.start||"",pace:o.pace||"normal",trav:{ad:o.ad,kids:o.kids,low:!!o.low,style:o.style||""},hotel:o.hotel||"",ints,days,docs:[]};
}

function packState(){return {hidden:S.hidden,rate:S.rate,note:S.note,edits:S.edits,custom:S.custom,routes:S.routes};}
async function encodeShare(){
 const bytes=new TextEncoder().encode(JSON.stringify(packState()));let out=bytes,pre="j";
 if(window.CompressionStream){try{const cs=new CompressionStream("deflate-raw");const w=cs.writable.getWriter();w.write(bytes);w.close();out=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre="z";}catch(e){out=bytes;pre="j";}}
 let s="";out.forEach(b=>s+=String.fromCharCode(b));return pre+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function decodeShare(str){
 const pre=str[0];let b=str.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
 const arr=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let bytes=arr;
 if(pre==="z"){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(arr);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());}
 return JSON.parse(new TextDecoder().decode(bytes));
}
function applyShared(o,mode){
 if(!o||typeof o!=="object")return;
 if(mode==="replace"){S.hidden=o.hidden||{};S.rate=o.rate||{};S.note=o.note||{};S.edits=o.edits||{};S.custom=Object.assign({site:[],hotel:[],rest:[],shop:[],market:[],food:[],transport:[],event:[]},o.custom||{});S.routes=o.routes||[];}
 else{
  Object.assign(S.hidden,o.hidden||{});Object.assign(S.rate,o.rate||{});Object.assign(S.note,o.note||{});Object.assign(S.edits,o.edits||{});
  Object.keys(o.custom||{}).forEach(c=>{S.custom[c]=S.custom[c]||[];(o.custom[c]||[]).forEach(it=>{if(!S.custom[c].some(x=>x.id===it.id))S.custom[c].push(it);});});
  (o.routes||[]).forEach(r=>{if(!S.routes.some(x=>x.id===r.id))S.routes.push(r);});
 }
 resetIdx();save();rerender();toast("השינויים נטענו ✔");
}

  case "rtShare":{const r=getRoute(d.id);if(r)shareText(r.name,routeText(r));break;}

  case "docAdd":{const t=$("#rdT").value.trim();let u=$("#rdU").value.trim();if(!u){toast("חובה להזין קישור");break;}if(!/^https?:\/\//i.test(u))u="https://"+u;rtMut(d.r,r=>{(r.docs=r.docs||[]).push({t,u,d:$("#rdD").value.trim()});});break;}
  case "docDel":rtMut(d.r,r=>{r.docs.splice(+d.i,1);});break;
  case "notifOn":if("Notification" in window)Notification.requestPermission().then(p=>{toast(p==="granted"?"התראות הופעלו ✔":"לא אושרו התראות");computeAlerts();});else toast("המכשיר לא תומך בהתראות");break;
  case "rateBase":if(RATE){S.rateBase={v:RATE.v,k:ymd(new Date())};save();computeAlerts();rerender();toast("נקודת ההשוואה עודכנה");}break;
 }
},true);
document.addEventListener("input",e=>{
 const t=e.target;if(!t||!t.classList)return;
 if(t.classList.contains("fq")&&t.dataset.tab){tf(t.dataset.tab).q=t.value;rerender();}
 else if(t.classList.contains("note")&&t.dataset.id){S.note[t.dataset.id]=t.value;save();}
 else if(t.id==="cvE")cvCalc("e");else if(t.id==="cvS")cvCalc("s");
});
document.addEventListener("change",e=>{
 const t=e.target;if(!t)return;
 if(t.dataset&&t.dataset.pref){S.prefs[t.dataset.pref]=+t.value||undefined;save();computeAlerts();return;}
 const chg=t.dataset&&t.dataset.chg;
 if(chg==="rtName"){const r=getRoute(t.dataset.r);if(r){r.name=t.value.trim()||r.name;save();}}
 else if(chg==="rtHotel")rtMut(t.dataset.r,r=>{r.hotel=t.value;});
 else if(chg==="stopMode")rtMut(t.dataset.r,r=>{r.days[+t.dataset.d].stops[+t.dataset.s].mode=t.value;});
 else if(chg==="atrRoute")atrFill();
 else if(t.id==="evFrom"||t.id==="evTo"){const f=tf("events");const v=t.value;f[t.id==="evFrom"?"from":"to"]=parseDMY(v)?v:"";rerender();}
 else if(t.id==="todD")todayRefresh();
 else if(t.id==="rtStart"){const d=parseDMY(t.value);rtMut(t.dataset.r,r=>{r.start=d?ymd(d):"";shiftDates(r);});}
 else if(/^rd_\d+$/.test(t.id)){const d=parseDMY(t.value);rtMut(t.dataset.r,r=>{r.days[+t.id.slice(3)].date=d?ymd(d):"";});}
});
document.addEventListener("submit",e=>{
 const f=e.target;e.preventDefault();
 if(f.id==="editForm")submitEdit(f);
 else if(f.id==="rwForm")submitWizard(f);
 else if(f.id==="atrForm")submitAtr(f);
 else if(f.id==="stopForm"){const r=getRoute(f.dataset.r);const st=r&&r.days[+f.dataset.d].stops[+f.dataset.s];if(st){const fd=new FormData(f);st.note=(fd.get("note")||"").trim();let u=(fd.get("url")||"").trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;st.url=u;st.ud=(fd.get("ud")||"").trim();save();closeModal();rerender();}}
 else if(f.id==="stopAddForm"){const id=f.id&&new FormData(f).get("id");if(!id){toast("בחרו מקום מהרשימה");return;}const r=getRoute(f.dataset.r);if(r){const dy=r.days[+f.dataset.d];const it=getItem(id);const prev=dy.stops.length?getItem(dy.stops[dy.stops.length-1].id):startPoint(r);const km=it&&it.la&&prev&&prev.la?hav(prev.la,prev.lo,it.la,it.lo)*1.3:1;dy.stops.push({id,mode:defMode(km,r.trav&&r.trav.low)});save();closeModal();rerender();}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#dp")&&$("#dp").style.display==="block")closeDP();else if($("#modal"))closeModal();}});
let scT=null;window.addEventListener("scroll",()=>{if(!curTab)return;clearTimeout(scT);scT=setTimeout(()=>{S.last.scroll[curTab]=window.scrollY;},200);},{passive:true});
function persistNow(){if(curTab)S.last.scroll[curTab]=window.scrollY;saveNow();}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")persistNow();});
window.addEventListener("pagehide",persistNow);

/* ---------- התקנה ---------- */
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;});

/* ---------- עותק יחיד פתוח ---------- */
let isDup=false;
const bcast=("BroadcastChannel" in window)?new BroadcastChannel("ams_guide_single"):null;
if(bcast)bcast.onmessage=e=>{const m=e.data||{};if(isDup)return;
 if(m.t==="focus"){try{window.focus();}catch(x){}toast("האפליקציה כבר הייתה פתוחה כאן – זה אותו עותק 👍",3500);}
 else if(m.t==="who")bcast.postMessage({t:"here",to:m.id});};
function singleInstance(){
 return new Promise(res=>{
  if(navigator.locks&&navigator.locks.request){
   navigator.locks.request("ams_guide_main",{ifAvailable:true},lock=>{if(!lock){res(false);return;}res(true);return new Promise(()=>{});}).catch(()=>res(true));
  }else if(bcast){
   const id=Math.random().toString(36).slice(2);let found=false;
   const h=e=>{if(e.data&&e.data.t==="here"&&e.data.to===id)found=true;};bcast.addEventListener("message",h);
   bcast.postMessage({t:"who",id});setTimeout(()=>{bcast.removeEventListener("message",h);res(!found);},350);
  }else res(true);
 });
}
function showDuplicate(){
 isDup=true;try{bcast&&bcast.postMessage({t:"focus"});}catch(e){}
 document.body.innerHTML=`<div class="dup"><div class="dupc"><div class="dupe">🇳🇱</div><h1>האפליקציה כבר פתוחה</h1><p>עברו לחלון שנפתח קודם – הוא הועלה לקדמת המסך. אפשר לסגור את החלון הזה.</p><button onclick="window.close()">סגירת החלון הזה</button></div></div>`;
 try{window.close();}catch(e){}
}

/* ---------- הפעלה ---------- */
async function boot(){
 renderRate();renderWx();
 let start=S.last.tab||"map";
 showTab(start,true);
 setTimeout(()=>{window.scrollTo(0,(S.last.scroll||{})[start]||0);},60);
 loadWx();loadRate();computeAlerts();
 setInterval(()=>loadWx(),30*60e3);
 if(location.hash.indexOf("#share=")===0){
  const tok=location.hash.slice(7);history.replaceState(null,"",location.pathname+location.search);
  try{const o=await decodeShare(tok);askApply(o);}catch(e){toast("הקישור ששותף לא תקין");}
 }
 if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});}
}
singleInstance().then(ok=>{if(!ok){showDuplicate();return;}boot();});

</script>
